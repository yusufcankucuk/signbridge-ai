name: SignBridge validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, "feature/**", "fix/**"]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signbridge-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signbridge-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:frontend
      - run: npm run test:security

  ai-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/tests/model-assets.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ai-training/requirements.validation.txt
      - run: python -m pip install -r ai-training/requirements.validation.txt
      - run: python -m pytest -q ai-training/tests
        env:
          PYTHONPATH: ai-training
